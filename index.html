<script>
(function(){
  try{
    var raw=localStorage.getItem('mc_config');
    var cfg=raw?JSON.parse(raw):{};
    var choice=cfg.theme||'dark';
    var resolved=choice==='system'&&window.matchMedia? (window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark') : choice;
    resolved = resolved==='light'?'light':'dark';
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.setAttribute('data-theme-choice', choice);
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', resolved==='light'?'#f7f2e7':'#060a10');
  }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();
</script>

<div id="borion-intro-splash" role="status" aria-live="polite" aria-label="Carregando Borion Finance">
  <img src="borion-emblem.png" alt="Borion Finance">
  <div class="splash-num">R$ 0,00</div>
  <div class="splash-tag">Carregando</div>
</div>
<script>
(function(){
  var splash=document.getElementById('borion-intro-splash');
  if(!splash)return;
  var numEl=splash.querySelector('.splash-num');
  var returning=false;
  try{returning=Object.keys(localStorage).some(function(key){return key.indexOf('borion_gdrive_folder_')===0;});}catch(e){}
  var duration=returning?520:820;
  var start=performance.now();
  function money(value){
    try{return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2}).format(value);}
    catch(e){return 'R$ '+Number(value||0).toFixed(2).replace('.',',');}
  }
  function tick(now){
    var t=Math.min(1,(now-start)/duration);
    var eased=1-Math.pow(1-t,4);
    if(numEl)numEl.textContent=money(eased*1000000);
    if(t<1){requestAnimationFrame(tick);return;}
    setTimeout(function(){
      splash.classList.add('is-leaving');
      setTimeout(function(){
        if(splash.parentNode)splash.parentNode.removeChild(splash);
        document.body.classList.remove('borion-intro-active');
        window.dispatchEvent(new CustomEvent('borion:intro-complete'));
      },returning?180:240);
    },returning?30:90);
  }
  requestAnimationFrame(tick);
})();
</script>
